# LiteLLM profile `anthropic` (paid, quality baseline for evals).
# Needs ANTHROPIC_API_KEY (an API key from the Claude Console, not a subscription).
# Model IDs are pinned snapshots; update them here, never in the app code.

model_list:
  - model_name: triage
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
      temperature: 0

  - model_name: assistant
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: reasoning
    litellm_params:
      model: anthropic/claude-sonnet-4-5-20250929
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: simulator
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: judge
    litellm_params:
      model: anthropic/claude-sonnet-4-5-20250929
      api_key: os.environ/ANTHROPIC_API_KEY
      temperature: 0

litellm_settings:
  drop_params: true
  request_timeout: 120
  # No Langfuse (or other) logging from LiteLLM: the agent service sends the traces.
  success_callback: []
  failure_callback: []
  callbacks: []

router_settings:
  num_retries: 2

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
