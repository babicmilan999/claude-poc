# Settings come from environment variables (Spring relaxed binding), for example
# SPRING_DATASOURCE_URL, SPRING_PROFILES_ACTIVE=simulation, BANKING_SEED_ENABLED.
server:
  port: 8080

spring:
  application:
    name: banking-service
  datasource:
    url: jdbc:postgresql://localhost:5432/app
    username: app
    password: app
  flyway:
    schemas: banking
    default-schema: banking
    create-schemas: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: banking
        jdbc:
          time_zone: UTC
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

banking:
  seed:
    # Seeds about 10 customers on an empty database at startup.
    enabled: true
