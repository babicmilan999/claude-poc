server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /index.html { add_header Cache-Control "no-cache"; }
  # Written at container start from API_BASE_URL (docker/write-config.sh). A 404 when
  # absent (never index.html), so the app keeps its build-time settings.
  location = /config.json {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }
  location / { try_files $uri $uri/ /index.html; }
}
